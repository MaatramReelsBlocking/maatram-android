<!DOCTYPE html>
<html lang="en">
<head>
<script>
/* ══ MAATRAM Performance Mode — shared across all pages ══ */
(function(){
  var KEY='maatram_perf';
  var weak = matchMedia('(pointer:coarse)').matches
          || innerWidth<820
          || (navigator.hardwareConcurrency||8)<=4
          || (navigator.deviceMemory||8)<=4;
  var saved=null; try{saved=localStorage.getItem(KEY);}catch(_){}
  var on = saved===null ? weak : saved==='1';
  window.MAATRAM_PERF = on;
  try{ if(saved===null) localStorage.setItem(KEY, on?'1':'0'); }catch(_){}
  document.documentElement.classList.toggle('perf', on);
})();
</script>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#06090B" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="format-detection" content="telephone=no" />
<title>Maatram — Focus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:        #06090B;
    --surface:   rgba(255,255,255,.022);
    --surface-2: rgba(255,255,255,.05);
    --line:      rgba(255,255,255,.08);
    --line-hi:   rgba(255,255,255,.18);
    --text:      #ECF2F1;
    --muted:     #7E8A8C;
    --faint:     #4C575A;

    --green:     #34D399;
    --blue:      #4E9BFF;
    --accent:    var(--green);

    --expo: cubic-bezier(.16,1,.3,1);
    --sans: 'Geist','Inter',-apple-system,system-ui,sans-serif;
    --mono: 'Geist Mono','JetBrains Mono',ui-monospace,monospace;

    --s1:8px; --s2:16px; --s3:24px; --s4:40px; --s5:64px;

    /* device chrome */
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
    --nav-h: 52px;
    --tab-h: 58px;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html{
    height:100%;
    -webkit-text-size-adjust:100%;
    overscroll-behavior:none;
  }

  body{
    min-height:100%;
    font-family:var(--sans);
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    overscroll-behavior-y:none;
    -webkit-tap-highlight-color:transparent;
    padding-top:calc(var(--nav-h) + var(--safe-t));
    padding-bottom:calc(var(--tab-h) + var(--safe-b));
  }

  ::selection{ background:var(--accent); color:var(--bg); }
  :focus-visible{ outline:1px solid var(--accent); outline-offset:3px; border-radius:6px; }
  button{ font-family:inherit; cursor:pointer; touch-action:manipulation; -webkit-user-select:none; user-select:none; }

  /* ================= reactive atmosphere ================= */
  .amb{ position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .par{ position:absolute; inset:0; will-change:transform; }

  .blob{
    position:absolute; border-radius:50%; filter:blur(80px);
    will-change:transform; transition:background 1s var(--expo);
  }
  .blob-1{ width:540px; height:540px; top:-16%; left:50%; margin-left:-270px;
           background:var(--accent); opacity:.26; }
  .blob-2{ width:460px; height:460px; bottom:-20%; left:4%;
           background:var(--blue); opacity:.16; }
  .blob-3{ width:340px; height:340px; top:34%; right:-6%;
           background:var(--accent); opacity:.09; }

  .cglow{
    position:fixed; top:0; left:0; width:620px; height:620px; border-radius:50%;
    margin:-310px 0 0 -310px; pointer-events:none; z-index:0; opacity:0;
    will-change:transform;
    background:radial-gradient(circle,
      color-mix(in srgb, var(--accent) 11%, transparent) 0%,
      color-mix(in srgb, var(--accent) 4%, transparent) 38%,
      transparent 66%);
    transition:opacity 1s var(--expo), background 1s var(--expo);
  }
  .cglow.on{ opacity:1; }

  .grid-fade{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      linear-gradient(to right, rgba(255,255,255,.03) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,.03) 1px, transparent 1px);
    background-size:60px 60px;
    -webkit-mask-image:radial-gradient(circle at 50% 34%, black 0%, transparent 70%);
            mask-image:radial-gradient(circle at 50% 34%, black 0%, transparent 70%);
  }

  .vig{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:radial-gradient(ellipse at 50% 40%, transparent 42%, rgba(0,0,0,.5) 100%);
  }

  .wrap{
    position:relative; z-index:1; max-width:760px; margin:0 auto;
    padding:var(--s3) calc(var(--s3) + var(--safe-l)) var(--s4) calc(var(--s3) + var(--safe-r));
  }

  /* ================= mode switch (segmented) ================= */
  .modes{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:var(--s1); margin-top:var(--s2); }

  .mode{
    position:relative; text-align:left; overflow:hidden; isolation:isolate;
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:14px 15px; min-height:64px; color:var(--text);
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
    transition:border-color .4s var(--expo), background .4s var(--expo), transform .15s var(--expo);
  }
  .mode::before{
    content:''; position:absolute; inset:0; z-index:-1; pointer-events:none;
    opacity:0; transition:opacity .45s var(--expo);
    background:radial-gradient(220px circle at var(--mx,50%) var(--my,50%),
               color-mix(in srgb, var(--m) 17%, transparent) 0%, transparent 62%);
  }
  @media(hover:hover){
    .mode:hover::before{ opacity:1; }
    .mode:hover{ border-color:var(--line-hi); }
  }
  .mode:active{ transform:scale(.975); }
  .mode::after{
    content:''; position:absolute; left:0; right:0; bottom:0; height:2px;
    background:var(--m); transform:scaleX(0); transform-origin:left;
    transition:transform .55s var(--expo);
  }
  .mode[aria-pressed="true"]::after{ transform:scaleX(1); }
  .mode[aria-pressed="true"]{ background:var(--surface-2); border-color:var(--line-hi); }
  .mode[aria-pressed="true"]::before{ opacity:.6; }
  .mode[data-mode="pomodoro"]{ --m:var(--green); }
  .mode[data-mode="deep"]    { --m:var(--blue);  }

  .m-name{ font-size:13.5px; font-weight:500; letter-spacing:-.01em; display:flex; align-items:center; }
  .m-split{ font-family:var(--mono); font-size:11.5px; color:var(--muted);
            margin-top:5px; font-variant-numeric:tabular-nums; }
  .m-pts{ position:absolute; top:11px; right:11px; font-family:var(--mono);
          font-size:10px; font-weight:800; color:#ff5d73;
          padding:3px 7px; border-radius:100px; border:1px solid rgba(255,93,115,.45);
          background:rgba(255,93,115,.1); pointer-events:none; }
  /* phones: card too narrow for name + pill on one line — push name below pill */
  @media(max-width:560px){
    .mode{ padding-top:36px; }
    .m-pts{ top:9px; right:9px; }
  }

  /* info button — 17px visual, 44px touch target */
  .info-btn{
    position:relative; display:inline-grid; place-items:center; width:18px; height:18px;
    margin-left:7px; border-radius:50%; border:1px solid rgba(255,255,255,.35);
    font-size:10px; font-style:italic; font-weight:800; color:rgba(255,255,255,.7);
    flex:0 0 auto;
  }
  .info-btn::after{ content:''; position:absolute; left:50%; top:50%;
    width:44px; height:44px; transform:translate(-50%,-50%); }
  .info-btn:hover,.info-btn:focus{ border-color:var(--accent); color:#eafff6; }

  /* ================= stage ================= */
  .stage{ text-align:center; padding-top:var(--s3); }

  .phase{ display:inline-flex; align-items:center; gap:7px; font-size:10px;
          letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
  .dot{ width:5px; height:5px; border-radius:50%; background:var(--accent);
        transition:background .6s var(--expo); }
  .dot.live{ animation:breathe 4s ease-in-out infinite; }
  @keyframes breathe{
    0%,100%{ opacity:.35; transform:scale(1); }
    50%    { opacity:1;   transform:scale(1.5); }
  }

  .dial{
    position:relative; margin:var(--s3) auto 0;
    width:min(76vw, 300px); height:min(76vw, 300px);
  }
  .dial svg{ width:100%; height:100%; transform:rotate(-90deg); overflow:visible; }
  .track{ fill:none; stroke:rgba(255,255,255,.07); stroke-width:1.5; }
  .arc{
    fill:none; stroke:var(--accent); stroke-width:2; stroke-linecap:round;
    transition:stroke-dashoffset .9s linear, stroke .6s var(--expo);
    filter:drop-shadow(0 0 8px color-mix(in srgb, var(--accent) 60%, transparent));
  }

  .clock{ position:absolute; inset:0; display:flex; flex-direction:column;
          align-items:center; justify-content:center; }

  .time{ display:flex; align-items:center; font-family:var(--mono); font-weight:400;
         font-size:clamp(40px, 13.5vw, 58px); letter-spacing:-.045em; height:1.1em; }
  .slot{ position:relative; width:.62em; height:1.1em; overflow:hidden; }
  .slot .d{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-variant-numeric:tabular-nums; will-change:transform;
  }
  .colon{ width:.34em; text-align:center; opacity:.28; }
  .sub{ font-size:11px; color:var(--faint); margin-top:10px; letter-spacing:.04em; }

  /* ================= controls ================= */
  .ctr{ display:flex; gap:10px; justify-content:center; margin-top:var(--s4); }
  .btn{
    font-size:14px; font-weight:500; padding:14px 22px; border-radius:12px;
    min-height:48px; min-width:96px;
    border:1px solid var(--line); background:var(--surface); color:var(--text);
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
    transition:border-color .3s var(--expo), background .3s var(--expo), transform .12s var(--expo);
  }
  @media(hover:hover){ .btn:hover{ border-color:var(--line-hi); background:var(--surface-2); } }
  .btn:active{ transform:scale(.96); }
  .btn-go{ background:var(--text); border-color:var(--text); color:var(--bg);
           min-width:150px; font-weight:600; font-size:15px; }
  @media(hover:hover){ .btn-go:hover{ background:#fff; border-color:#fff; } }

  .hint{ margin-top:var(--s3); font-size:11px; color:var(--faint); }
  .hint kbd{ font-family:var(--mono); font-size:10px; color:var(--muted);
             border:1px solid var(--line); border-radius:4px; padding:2px 5px; margin:0 1px; }
  @media(pointer:coarse){ .hint{ display:none; } }

  .keep-awake{ margin-top:var(--s2); font-size:10.5px; color:var(--faint);
               letter-spacing:.05em; display:none; }
  .keep-awake.on{ display:block; }

  /* ================= power-up ================= */
  .pu{
    position:fixed; inset:0; z-index:900; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    padding:calc(var(--s3) + var(--safe-t)) var(--s3) calc(var(--s3) + var(--safe-b));
    background:rgba(6,9,11,.86);
    -webkit-backdrop-filter:blur(22px); backdrop-filter:blur(22px);
    opacity:0; visibility:hidden; overflow-y:auto;
  }
  .pu.on{ visibility:visible; }
  .pu-glow{
    position:absolute; width:min(120vw,620px); height:min(120vw,620px); border-radius:50%; pointer-events:none;
    background:radial-gradient(circle, color-mix(in srgb, var(--accent) 28%, transparent) 0%, transparent 66%);
    filter:blur(48px);
  }
  .ring{ position:absolute; width:min(52vw,200px); height:min(52vw,200px); border-radius:50%;
         border:1px solid var(--accent); opacity:0; pointer-events:none; }
  .pu-in{ position:relative; display:flex; flex-direction:column; align-items:center; width:100%; }
  .pu-eye{ font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--accent); }
  .pu-h{ font-size:clamp(22px,6.5vw,34px); font-weight:600; letter-spacing:-.035em; margin-top:10px; }
  .pu-pts{ font-family:var(--mono); font-weight:500; font-size:clamp(54px,17vw,86px);
           letter-spacing:-.05em; color:var(--accent); line-height:1; margin:16px 0 4px;
           font-variant-numeric:tabular-nums; }
  .pu-sub{ font-size:13.5px; color:var(--muted); max-width:320px; line-height:1.6; }
  .pu-act{ display:flex; flex-direction:column; gap:10px; margin-top:var(--s4);
           width:100%; max-width:320px; }
  .pu-act .btn{ width:100%; }

  /* ================= bottom sheet (info + confirm) ================= */
  .mt-sheet-back{
    position:fixed; inset:0; z-index:940; background:rgba(0,0,0,.55);
    -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
    opacity:0; pointer-events:none; transition:opacity .28s var(--expo);
  }
  .mt-sheet-back.on{ opacity:1; pointer-events:auto; }
  .mt-sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:950;
    background:#0A1113; border-top:1px solid rgba(47,227,143,.28);
    border-radius:20px 20px 0 0;
    padding:10px calc(var(--s3) + var(--safe-l)) calc(var(--s3) + var(--safe-b)) calc(var(--s3) + var(--safe-r));
    transform:translateY(101%); transition:transform .34s var(--expo);
    max-height:82vh; overflow-y:auto; -webkit-overflow-scrolling:touch;
  }
  .mt-sheet.on{ transform:translateY(0); }
  .mt-grab{ width:38px; height:4px; border-radius:100px; background:rgba(255,255,255,.22);
               margin:0 auto 18px; }
  .mt-sheet h3{ font-size:15px; font-weight:600; letter-spacing:-.02em; margin-bottom:8px; }
  .mt-sheet p{ font-size:13.5px; line-height:1.65; color:#cfe9dd; }
  .mt-sheet p + p{ margin-top:10px; }
  .mt-sheet .pts-line{ color:var(--accent); font-weight:600; }
  .mt-sheet-act{ display:flex; gap:10px; margin-top:var(--s3); }
  .mt-sheet-act .btn{ flex:1; min-width:0; }

  /* sheet rows (More menu) */
  .srow{
    display:flex; align-items:center; gap:12px; width:100%;
    padding:15px 4px; min-height:52px; background:none; border:0;
    color:var(--text); font-size:14.5px; font-weight:500; text-align:left;
    text-decoration:none; border-bottom:1px solid rgba(255,255,255,.06);
  }
  .srow:last-child{ border-bottom:0; }
  .srow .ic{ font-size:17px; width:24px; text-align:center; flex:0 0 auto; }
  .srow:active{ background:rgba(255,255,255,.05); }
  .srow .rt{ margin-left:auto; font-size:11px; font-weight:700; letter-spacing:.08em;
             text-transform:uppercase; color:var(--faint); }
  .srow.danger{ color:#ff5d73; }

  .pf-sw{ width:34px; height:19px; border-radius:100px; border:1px solid rgba(255,255,255,.3);
          position:relative; transition:all .25s; flex:0 0 auto; margin-left:auto; }
  .pf-sw::after{ content:""; position:absolute; top:2px; left:2.5px; width:13px; height:13px;
                 border-radius:50%; background:#cfe9dd; transition:all .25s; }
  html.perf .pf-sw{ background:linear-gradient(90deg,#2fe38f,#37b6ff); border-color:transparent; }
  html.perf .pf-sw::after{ left:17px; background:#04120f; }

  /* ================= top bar ================= */
  #mnav{
    position:fixed; top:0; left:0; right:0; z-index:600;
    height:calc(var(--nav-h) + var(--safe-t));
    padding:var(--safe-t) calc(14px + var(--safe-r)) 0 calc(14px + var(--safe-l));
    display:flex; align-items:center; gap:8px;
    background:rgba(2,10,8,.86);
    -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(47,227,143,.15);
  }
  #mnav .mn-logo{ display:flex; align-items:center; gap:9px; text-decoration:none; color:#eafff6; }
  #mnav .mn-mark{ width:28px; height:28px; border-radius:9px;
    background:linear-gradient(135deg,#2fe38f,#37b6ff);
    display:grid; place-items:center; font-weight:800; color:#04120f; font-size:15px; }
  #mnav .mn-logo b{ font-size:13.5px; font-weight:700; letter-spacing:.4px; }
  #mnav .mn-spacer{ flex:1; }

  .bank-chip{
    display:flex; align-items:baseline; gap:5px; padding:6px 12px; border-radius:100px;
    border:1px solid rgba(255,209,102,.3); background:rgba(255,209,102,.07);
  }
  .bank-n{ font-family:var(--mono); font-size:14px; font-weight:600; color:#ffd166;
           font-variant-numeric:tabular-nums; letter-spacing:-.02em; }
  .bank-l{ font-size:9px; color:rgba(255,209,102,.65); letter-spacing:.12em;
           text-transform:uppercase; font-weight:700; }

  #mnavAuth{ display:flex; align-items:center; }
  #mnavIn{ font-size:10.5px; font-weight:800; letter-spacing:1px; text-transform:uppercase;
    color:#04120f; text-decoration:none; padding:9px 15px; border-radius:100px;
    background:linear-gradient(90deg,#2fe38f,#37b6ff); white-space:nowrap; }
  #mnavChip{ display:none; align-items:center; position:relative; }
  #mnavChip img{ width:32px; height:32px; border-radius:50%; border:1px solid #2fe38f; display:block; }
  #mnavChip .nm{ display:none; }
  #mnavPts{ display:none; }
  #mnavMenu{ display:none; }

  /* ================= bottom tab bar ================= */
  #mtabs{
    position:fixed; left:0; right:0; bottom:0; z-index:600;
    height:calc(var(--tab-h) + var(--safe-b));
    padding:0 var(--safe-r) var(--safe-b) var(--safe-l);
    display:grid; grid-template-columns:repeat(6,minmax(0,1fr));
    background:rgba(2,10,8,.92);
    -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px);
    border-top:1px solid rgba(47,227,143,.15);
  }
  #mtabs a, #mtabs button{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    text-decoration:none; background:none; border:0; color:#6f8f84;
    font-size:9px; font-weight:700; letter-spacing:.4px; text-transform:uppercase;
    padding:0 2px; position:relative;
  }
  #mtabs .ti{ font-size:19px; line-height:1; }
  #mtabs .active{ color:#2fe38f; }
  #mtabs .active::before{
    content:''; position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:26px; height:2px; border-radius:0 0 3px 3px;
    background:linear-gradient(90deg,#2fe38f,#37b6ff);
  }
  #mtabs a:active, #mtabs button:active{ background:rgba(255,255,255,.05); }

  /* wide screens: keep the desktop link row, drop the tab bar */
  @media(min-width:900px){
    body{ padding-bottom:var(--s3); }
    #mtabs{ display:none; }
    #mnav .mn-links{ display:flex; gap:4px; }
    #mnavChip .nm{ display:block; font-size:12px; font-weight:700; color:#eafff6;
                   max-width:110px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    #mnavPts{ display:inline-block; font-size:10px; font-weight:800; color:#ffd166;
              letter-spacing:.5px; padding:3px 8px; border-radius:100px;
              border:1px solid rgba(255,209,102,.35); background:rgba(255,209,102,.08); white-space:nowrap; }
    #mnavChip{ gap:8px; padding:4px 6px; border-radius:100px;
               border:1px solid rgba(47,227,143,.3); background:rgba(47,227,143,.06); }
    #mnavChip img{ width:28px; height:28px; }
    #mnavMenu.open{ display:block; position:absolute; top:46px; right:0; min-width:180px; z-index:700;
      background:rgba(6,18,14,.97); border:1px solid rgba(47,227,143,.25); border-radius:14px; padding:8px;
      box-shadow:0 18px 50px -12px rgba(0,0,0,.8); }
    #mnavMenu a, #mnavMenu button{ display:block; width:100%; text-align:left; padding:10px 13px;
      border-radius:9px; background:transparent; border:none; color:#eafff6; font-family:inherit;
      font-size:12px; font-weight:600; text-decoration:none; }
    #mnavMenu .out{ color:#ff5d73; }
  }
  .mn-links{ display:none; }
  .mn-links a{ font-size:10.5px; font-weight:700; letter-spacing:1px; text-transform:uppercase;
    color:#7da99b; text-decoration:none; padding:8px 11px; border-radius:100px; white-space:nowrap; }
  .mn-links a.active{ color:#04120f; background:linear-gradient(90deg,#2fe38f,#37b6ff); }

  /* ================= reduced motion / touch perf ================= */
  @media (prefers-reduced-motion:reduce){
    *{ animation:none !important; transition-duration:.01ms !important; }
    .blob{ opacity:.12; }
    .cglow{ display:none; }
  }
  @media(pointer:coarse){
    .blob{ filter:blur(36px)!important; opacity:.14!important; animation:none!important; }
    .par{ will-change:auto; }
    .cglow{ display:none; }
  }
  html.perf .blob{ filter:blur(30px); opacity:.12; }
  html.perf .grid-fade{ display:none; }

  /* short screens (landscape phone) */
  @media(max-height:560px){
    .dial{ width:min(40vh,190px); height:min(40vh,190px); margin-top:var(--s2); }
    .stage{ padding-top:var(--s2); }
    .ctr{ margin-top:var(--s3); }
    .modes{ margin-top:var(--s1); }
  }
</style>
<script>
/* stub so feature code can always call it; hosted engine overrides */
window.maatramAward=window.maatramAward||function(pts,reason){
  try{const c=+localStorage.getItem('maatram_points')||0;
      localStorage.setItem('maatram_points',Math.max(0,c+Math.round(pts)));}catch(_){}
  try{ new BroadcastChannel('maatram').postMessage({type:'points',pts}); }catch(_){}
  try{ parent.postMessage({maatramRelay:{type:'points',pts}},'*'); }catch(_){}
};
</script>

<script type="module">
/* Motion drives choreography. If the CDN is blocked or you're offline,
   M stays null and everything renders in its final state. */
let M = null;
try {
  const mod = await import('https://cdn.jsdelivr.net/npm/motion@11.11.13/+esm');
  if (mod && typeof mod.animate === 'function') M = mod;
} catch (e) { console.warn('Motion unavailable — running without choreography.'); }

const REDUCED = (window.MAATRAM_PERF===true) || matchMedia('(prefers-reduced-motion: reduce)').matches;
const LIVE    = !!M && !REDUCED;
const HOVER   = matchMedia('(hover:hover) and (pointer:fine)').matches;
const TOUCH   = matchMedia('(pointer:coarse)').matches;
const EXPO    = [0.16, 1, 0.3, 1];
const SPRING  = { type:'spring', stiffness:90, damping:20 };

function awardPoints(pts){ window.maatramAward(pts,'Focus session'); }

function safeFinished(controls) {
  const f = controls && controls.finished;
  return (f && typeof f.then === 'function') ? f : Promise.resolve();
}
function safeAnimate(...args) {
  try { return M.animate(...args); }
  catch (e) { return null; }
}
const $ = id => document.getElementById(id);

/* ── haptics ── */
function buzz(pattern){ try{ navigator.vibrate && navigator.vibrate(pattern); }catch(_){} }

const MODES = {
  pomodoro: { label:'Pomodoro',  focus:25*60, brk:5*60,  pts:25,  accent:'#34D399' },
  deep:     { label:'Deep Work', focus:90*60, brk:15*60, pts:100, accent:'#4E9BFF' }
};

const INFO = {
  pomodoro:{
    title:'Pomodoro — 25 min focus / 5 min break',
    body:'Short, repeatable sprints that beat procrastination. Easier to start, trains sustained attention, frequent breaks prevent burnout, and each finished sprint is a quick win.',
    pts:'+25 pts per completed focus session, added to your leaderboard total.'
  },
  deep:{
    title:'Deep Work — 90 min focus / 15 min break',
    body:'One long, distraction-free block for hard tasks. Reach true flow state, finish demanding work faster, and build the concentration stamina social media erodes.',
    pts:'+100 pts per completed session — the biggest single reward in Maatram.'
  }
};

const LINES = [
  'That time was going to pass anyway. You spent it well.',
  'Nobody saw you do that. It counted regardless.',
  'Stand up. Find a window. Come back.',
  'Consistency beats intensity. Again tomorrow.',
  'Starting was the hard part, and it is behind you.'
];

const CIRC = 2 * Math.PI * 112;

/* endTs = wall-clock deadline. Never trust setInterval on mobile —
   background tabs get throttled to once a minute or frozen outright. */
const S = { mode:'pomodoro', phase:'focus', left:MODES.pomodoro.focus,
            running:false, endTs:0, sessions:0, points:0, tick:null };

const el = {
  time:$('time'), phase:$('phase'), sub:$('sub'), arc:$('arc'), dot:$('dot'),
  go:$('go'), reset:$('reset'), bank:$('bank'), wakeNote:$('wakeNote'),
  pu:$('pu'), puPts:$('pu-pts'), puSub:$('pu-sub'), puH:$('pu-h'), puEye:$('pu-eye'),
  puBreak:$('pu-break'), puSkip:$('pu-skip'), puGlow:$('pu-glow'),
  cglow:$('cglow')
};

el.arc.style.strokeDasharray = CIRC;
const cfg   = () => MODES[S.mode];
const total = () => S.phase === 'focus' ? cfg().focus : cfg().brk;

/* ============ digit roll ============ */
const slots = [...el.time.querySelectorAll('.slot')];
const mkD = v => { const s=document.createElement('span'); s.className='d'; s.textContent=v; return s; };

function setDigits(str) {
  slots.forEach((slot, i) => {
    const v = str[i];
    if (slot.dataset.v === v) return;
    const first = slot.dataset.v === undefined;
    slot.dataset.v = v;

    if (!LIVE || first) { slot.replaceChildren(mkD(v)); return; }

    const ds = [...slot.children];
    ds.slice(0, -1).forEach(n => n.remove());
    const cur = ds[ds.length - 1] || null;

    const next = mkD(v);
    /* pre-position off-screen BEFORE it hits the DOM — never a stacked frame */
    next.style.transform = 'translateY(105%)';
    slot.appendChild(next);

    const snap = () => {                      /* animation missing/failed → instant swap */
      if (cur) cur.remove();
      next.style.transform = '';
      next.style.opacity = '';
    };

    const up = safeAnimate(next, { transform:['translateY(105%)','translateY(0%)'], opacity:[0,1] },
                    { duration:.3, ease:EXPO });
    if (!up) { snap(); return; }

    if (cur) {
      const kill = () => cur.remove();
      safeFinished(safeAnimate(cur, { transform:['translateY(0%)','translateY(-105%)'], opacity:[1,0] },
                     { duration:.3, ease:EXPO })).then(kill, kill);
      setTimeout(kill, 400);
    }
    safeFinished(up).then(()=>{ next.style.transform=''; next.style.opacity=''; }, snap);
    setTimeout(()=>{ next.style.transform=''; next.style.opacity=''; }, 400);
  });
}

const mmss = s => String(Math.floor(s/60)).padStart(2,'0') + String(s%60).padStart(2,'0');

/* ============ render ============ */
function paint() {
  const d = mmss(S.left);
  setDigits(d);
  el.phase.textContent = S.phase === 'focus' ? 'Focus' : 'Break';
  el.sub.textContent   = 'Session ' + (S.sessions + 1);
  el.bank.textContent  = S.points;
  el.arc.style.strokeDashoffset = CIRC * (1 - S.left / total());
  el.dot.classList.toggle('live', S.running);
  el.go.textContent = S.running ? 'Pause'
                    : S.left < total() ? 'Resume'
                    : S.phase === 'focus' ? 'Start' : 'Start break';
  document.title = S.running ? `${d.slice(0,2)}:${d.slice(2)} · Maatram` : 'Maatram — Focus';
}
const accent = () => document.documentElement.style.setProperty('--accent', cfg().accent);

/* ============ wake lock — screen must not sleep mid-session ============ */
let wl = null;
async function wakeOn(){
  try{
    if (!('wakeLock' in navigator) || wl) return;
    wl = await navigator.wakeLock.request('screen');
    wl.addEventListener('release', ()=>{ wl=null; el.wakeNote.classList.remove('on'); });
    el.wakeNote.classList.add('on');
  }catch(_){}
}
function wakeOff(){ try{ wl && wl.release(); }catch(_){} wl=null; el.wakeNote.classList.remove('on'); }
document.addEventListener('visibilitychange', ()=>{
  if (document.visibilityState === 'visible') {
    if (S.running) { wakeOn(); syncFromClock(); }   // resync after throttle/freeze
  }
});

/* ============ audio — mobile needs an unlock gesture ============ */
let AC = null;
function audioUnlock(){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext; if (!Ctx) return;
    if (!AC) AC = new Ctx();
    if (AC.state === 'suspended') AC.resume();
  }catch(_){}
}
addEventListener('pointerdown', audioUnlock, { once:true, passive:true });

function chime() {
  try {
    audioUnlock(); if (!AC) return;
    [523.25, 659.25, 783.99].forEach((f, i) => {
      const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + i*.16;
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(.14, t + .02);
      g.gain.exponentialRampToValueAtTime(.0001, t + .44);
      o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + .46);
    });
  } catch (e) {}
}

/* ============ clock — wall-clock driven ============ */
function syncFromClock(){
  if (!S.running) return;
  const left = Math.max(0, Math.round((S.endTs - Date.now())/1000));
  if (left !== S.left) { S.left = left; paint(); }
  if (left <= 0) done();
}

function stop(){
  if (S.running && S.endTs) S.left = Math.max(0, Math.round((S.endTs - Date.now())/1000));
  S.running = false; S.endTs = 0;
  clearInterval(S.tick); S.tick = null;
  wakeOff(); saveT();
}

function start() {
  if (S.running) return;
  audioUnlock();
  S.running = true;
  S.endTs = Date.now() + S.left * 1000;
  clearInterval(S.tick);
  S.tick = setInterval(syncFromClock, 250);
  wakeOn(); buzz(12); saveT(); paint();
}

function done() {
  stop(); chime(); buzz([0,90,70,90,70,180]);
  if (S.phase === 'focus') { S.sessions++; S.points += cfg().pts; awardPoints(cfg().pts); saveT(); powerup(); }
  else { S.phase = 'focus'; S.left = cfg().focus; saveT(); paint(); }
}

/* ============ power-up ============ */
function powerup() {
  const earned = cfg().pts;
  el.puEye.textContent   = cfg().label + ' complete';
  el.puH.textContent     = S.sessions === 1 ? 'First one down' : S.sessions + ' sessions today';
  el.puSub.textContent   = LINES[Math.floor(Math.random() * LINES.length)];
  el.puBreak.textContent = 'Take the ' + (cfg().brk / 60) + '-minute break';
  el.puPts.textContent   = '+0';
  el.pu.classList.add('on');

  if (!LIVE) { el.pu.style.opacity='1'; el.puPts.textContent='+'+earned; el.puBreak.focus(); return; }

  safeAnimate(el.pu, { opacity:[0,1] }, { duration:.4, ease:EXPO });
  safeAnimate(el.puGlow, { scale:[.4,1], opacity:[0,1] }, { duration:1.1, ease:EXPO });

  document.querySelectorAll('.ring').forEach((r, i) =>
    safeAnimate(r, { scale:[.5,3.2], opacity:[.55,0] },
              { duration:2.8, delay:i*.85, repeat:Infinity, ease:'easeOut' }));

  const inner = [...el.pu.querySelectorAll('.pu-eye,.pu-h,.pu-pts,.pu-sub,.pu-act')];
  const ic = safeAnimate(inner, { opacity:[0,1], transform:['translateY(14px)','translateY(0px)'] },
            { duration:.6, delay:M.stagger(.06, { startDelay:.12 }), ease:EXPO });
  safeFinished(ic).then(() => inner.forEach(n => n.style.transform = ''));

  safeAnimate(0, earned, { duration:1.1, delay:.28, ease:EXPO,
    onUpdate: v => { el.puPts.textContent = '+' + Math.round(v); } });

  el.puBreak.focus();
}

function closePU(takeBreak) {
  const finish = () => {
    el.pu.classList.remove('on');
    el.pu.style.opacity = '';
    S.phase = takeBreak ? 'break' : 'focus';
    S.left  = takeBreak ? cfg().brk : cfg().focus;
    paint(); saveT();
    if (takeBreak) start();
  };
  if (!LIVE) { finish(); return; }
  safeFinished(safeAnimate(el.pu, { opacity:[1,0] }, { duration:.32, ease:EXPO })).then(finish);
}

/* ============ bottom sheet ============ */
const sheet = $('mtSheet'), sheetBack = $('mtSheetBack'), sheetBody = $('mtSheetBody');
let sheetOnClose = null;

function openSheet(html, onClose){
  sheetBody.innerHTML = html;
  sheetOnClose = onClose || null;
  sheet.classList.add('on'); sheetBack.classList.add('on');
}
function closeSheet(){
  sheet.classList.remove('on'); sheetBack.classList.remove('on');
  const f = sheetOnClose; sheetOnClose = null;
  if (f) setTimeout(f, 60);
}
sheetBack.addEventListener('click', closeSheet);
window.mtOpenSheet=openSheet; window.mtCloseSheet=closeSheet;

/* swipe-down to dismiss */
(function(){
  let y0=null;
  sheet.addEventListener('touchstart', e=>{ if(sheet.scrollTop<=0) y0=e.touches[0].clientY; }, {passive:true});
  sheet.addEventListener('touchmove', e=>{
    if(y0===null) return;
    const dy=e.touches[0].clientY-y0;
    if(dy>0) sheet.style.transform=`translateY(${dy}px)`;
  }, {passive:true});
  sheet.addEventListener('touchend', e=>{
    if(y0===null) return;
    const dy=(e.changedTouches[0].clientY-y0); y0=null;
    sheet.style.transform='';
    if(dy>90) closeSheet();
  }, {passive:true});
})();

function infoSheet(key){
  const d = INFO[key]; if(!d) return;
  openSheet(`<h3>${d.title}</h3><p>${d.body}</p><p class="pts-line">${d.pts}</p>
             <div class="mt-sheet-act"><button class="btn btn-go" id="shOk">Got it</button></div>`);
  $('shOk').onclick = closeSheet;
}

function confirmSheet(title, body, okLabel, onOk){
  let ok=false;
  openSheet(`<h3>${title}</h3><p>${body}</p>
    <div class="mt-sheet-act"><button class="btn" id="shNo">Cancel</button>
    <button class="btn btn-go" id="shYes">${okLabel}</button></div>`, ()=>{ if(ok) onOk(); });
  $('shNo').onclick = closeSheet;
  $('shYes').onclick = ()=>{ ok=true; closeSheet(); };
}

/* More menu */
$('moreBtn').addEventListener('click', ()=>{
  const perfOn = document.documentElement.classList.contains('perf');
  openSheet(`
    <a class="srow" href="leaderboard.html"><span class="ic">🏆</span>Leaderboard</a>
    <a class="srow" href="socials.html"><span class="ic">🔗</span>Socials</a>
    <a class="srow" href="login.html" id="mtRowLogin"><span class="ic">👤</span>Account</a>
    <button class="srow" id="mtRowPerf"><span class="ic">⚡</span>Performance mode<span class="pf-sw"></span></button>
    <button class="srow danger" id="mtRowOut" style="display:none"><span class="ic">⏻</span>Sign out</button>
  `);
  if (window.__mtSignedIn) { $('mtRowOut').style.display='flex'; $('mtRowLogin').style.display='none'; }
  $('mtRowPerf').onclick = ()=>{
    const on = !(localStorage.getItem('maatram_perf')==='1');
    try{ localStorage.setItem('maatram_perf', on?'1':'0'); }catch(_){}
    location.reload();
  };
  $('mtRowOut').onclick = ()=>{ closeSheet(); window.__mtSignOut && window.__mtSignOut(); };
});

/* ============ atmosphere ============ */
function reactive() {
  if (!HOVER || REDUCED) return;
  const p = { x:.5, y:.5, tx:.5, ty:.5 };
  const layers = [
    { el:$('par1'), dx:-58, dy:-42 },
    { el:$('par2'), dx: 76, dy: 54 },
    { el:$('par3'), dx:-34, dy: 30 }
  ];
  let awake = false;
  addEventListener('pointermove', e => {
    p.tx = e.clientX / innerWidth; p.ty = e.clientY / innerHeight;
    if (!awake) { awake = true; el.cglow.classList.add('on'); }
  }, { passive:true });
  const loop = () => {
    p.x += (p.tx - p.x) * .055; p.y += (p.ty - p.y) * .055;
    const ox = p.x - .5, oy = p.y - .5;
    for (const L of layers) L.el.style.transform = `translate3d(${ox*L.dx}px, ${oy*L.dy}px, 0)`;
    el.cglow.style.transform = `translate3d(${p.x*innerWidth}px, ${p.y*innerHeight}px, 0)`;
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}

function drift() {
  if (!LIVE || TOUCH) return;   /* ambient drift is the #1 battery drain on phones */
  const paths = [
    ['blob1', ['translate(0px,0px)','translate(44px,32px)','translate(-28px,16px)','translate(0px,0px)'], 26],
    ['blob2', ['translate(0px,0px)','translate(-36px,-24px)','translate(22px,-12px)','translate(0px,0px)'], 32],
    ['blob3', ['translate(0px,0px)','translate(26px,-30px)','translate(-18px,20px)','translate(0px,0px)'], 38]
  ];
  for (const [id, frames, dur] of paths)
    safeAnimate($(id), { transform:frames }, { duration:dur, repeat:Infinity, ease:'easeInOut' });
}

function spotlights() {
  if (!HOVER) return;
  document.querySelectorAll('.mode').forEach(c => {
    c.addEventListener('pointermove', e => {
      const r = c.getBoundingClientRect();
      c.style.setProperty('--mx', (e.clientX - r.left) + 'px');
      c.style.setProperty('--my', (e.clientY - r.top)  + 'px');
    }, { passive:true });
  });
}

function enter() {
  if (!LIVE) return;
  const items = [...document.querySelectorAll('[data-r]')];
  items.forEach(n => n.style.opacity = '0');
  const c = safeAnimate(items, { opacity:[0,1], transform:['translateY(12px)','translateY(0px)'] },
            { duration:.62, delay:M.stagger(.045), ease:EXPO });
  safeFinished(c).then(() => items.forEach(n => { n.style.transform=''; n.style.opacity=''; }));
}

/* ============ events ============ */
document.querySelectorAll('.mode').forEach(btn => {
  btn.addEventListener('click', ev => {
    const ib = ev.target.closest('.info-btn');
    if (ib) { ev.preventDefault(); ev.stopPropagation(); infoSheet(ib.dataset.info); return; }

    const next = btn.dataset.mode;
    if (next === S.mode) return;

    const swap = () => {
      stop();
      S.mode = next; S.phase = 'focus'; S.left = cfg().focus; saveT();
      document.querySelectorAll('.mode').forEach(b =>
        b.setAttribute('aria-pressed', String(b.dataset.mode === next)));
      accent(); paint(); buzz(10);
      if (LIVE) safeAnimate(btn, { scale:[.98,1] }, SPRING);
    };

    if (S.running) {
      confirmSheet('Switch mode?', 'This session is dropped and earns no points.', 'Switch', swap);
      return;
    }
    swap();
  });
});

el.go.addEventListener('click',      () => S.running ? (stop(), paint()) : start());
el.reset.addEventListener('click',   () => { stop(); S.phase='focus'; S.left=cfg().focus; saveT(); paint(); buzz(10); });
el.puBreak.addEventListener('click', () => closePU(true));
el.puSkip.addEventListener('click',  () => closePU(false));

addEventListener('keydown', e => {
  if (el.pu.classList.contains('on')) return;
  if (sheet.classList.contains('on')) { if (e.key === 'Escape') closeSheet(); return; }
  if (e.target.closest('button')) return;
  if (e.key === ' ') { e.preventDefault(); el.go.click(); }
  if (e.key.toLowerCase() === 'r') el.reset.click();
});

/* ============ persistence: timer survives navigation ============ */
const TKEY='maatram_timer_state';
function saveT(){
  try{localStorage.setItem(TKEY,JSON.stringify({
    mode:S.mode,phase:S.phase,left:S.left,running:S.running,
    endTs:S.running?S.endTs:0,
    sessions:S.sessions,points:S.points,ts:Date.now()}));}catch(_){}
}
function restoreT(){
  let d=null; try{d=JSON.parse(localStorage.getItem(TKEY)||'null');}catch(_){}
  if(!d||!MODES[d.mode]) return;
  S.mode=d.mode; S.sessions=d.sessions||0; S.points=d.points||0;
  S.phase=d.phase==='break'?'break':'focus';
  document.querySelectorAll('.mode').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===S.mode)));
  if(d.running&&d.endTs){
    const left=Math.round((d.endTs-Date.now())/1000);
    if(left>0){ S.left=left; accent(); paint(); start(); return; }
    /* finished while away — award it */
    S.left=0; accent();
    if(S.phase==='focus'){ S.sessions++; S.points+=cfg().pts; awardPoints(cfg().pts); saveT(); paint(); powerup(); return; }
    S.phase='focus'; S.left=cfg().focus;
  } else {
    S.left=Math.min(d.left??total(), total());
  }
  accent(); paint();
}
setInterval(()=>{ if(S.running) saveT(); },5000);

accent(); restoreT(); paint(); enter(); drift(); reactive(); spotlights();
</script>

<script>
/* ══ universal nav auth (Firebase session shared across all pages) ══ */
(async()=>{
  const chip=document.getElementById('mnavChip'),inBtn=document.getElementById('mnavIn'),
        menu=document.getElementById('mnavMenu');
  if(!chip)return;
  chip.addEventListener('click',e=>{ if(!e.target.closest('#mnavMenu')) menu.classList.toggle('open'); });
  document.addEventListener('click',e=>{ if(!e.target.closest('#mnavChip')) menu.classList.remove('open'); });
  if(!(location.protocol==='http:'||location.protocol==='https:'))return;  // file:// → nav stays simple
  try{
    const [{initializeApp,getApps,getApp},{getAuth,onAuthStateChanged,signOut},{getFirestore,doc,onSnapshot,runTransaction}]=await Promise.all([
      import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js'),
      import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js')
    ]);
    const app=getApps().length?getApp():initializeApp({apiKey:"AIzaSyAjiAm61IkH3wB1tjwOyGRrXAuRMKQyCcQ",authDomain:"maatram-859f4.firebaseapp.com",projectId:"maatram-859f4",storageBucket:"maatram-859f4.firebasestorage.app",messagingSenderId:"770970784123",appId:"1:770970784123:web:7c73c74ddb2179b69dedde"});
    const auth=getAuth(app),db=getFirestore(app);
    let unsub=null;
    let __mtUser=null;
    window.__mtSignOut=()=>signOut(auth);

    window.maatramAward=async function(pts,reason){
      pts=Math.round(pts); if(!pts) return;
      try{
        const cur=+localStorage.getItem('maatram_points')||0;
        localStorage.setItem('maatram_points',Math.max(0,cur+pts));
      }catch(_){}
      try{ new BroadcastChannel('maatram').postMessage({type:'points',pts}); }catch(_){}
      try{ parent.postMessage({maatramRelay:{type:'points',pts}},'*'); }catch(_){}
      mtToast(pts,reason);
      if(__mtUser){
        const uid=__mtUser.uid;
        try{
          await runTransaction(db,async t=>{
            const r=doc(db,'users',uid);
            const s=await t.get(r);
            const cur=(s.exists()&&s.data().points)||0;
            let nx=cur+pts;
            nx=Math.max(0,Math.max(cur-100,Math.min(cur+200,nx)));
            t.set(r,{points:nx},{merge:true});
          });
        }catch(e){ console.warn('points write',e); }
      }
    };

    function mtToast(pts,reason){
      const t=document.createElement('div');
      t.textContent=(pts>0?'+':'')+pts+' PTS'+(reason?' · '+reason:'');
      t.style.cssText='position:fixed;left:50%;transform:translate(-50%,-14px);'
        +'top:calc(env(safe-area-inset-top,0px) + 62px);z-index:960;'
        +'font-family:Sora,Inter,sans-serif;max-width:calc(100vw - 32px);text-align:center;'
        +'font-weight:800;font-size:13px;letter-spacing:1px;padding:11px 20px;border-radius:100px;'
        +'backdrop-filter:blur(10px);transition:all .5s cubic-bezier(.2,1.3,.3,1);opacity:0;'
        +(pts>0?'color:#04120f;background:linear-gradient(90deg,#2fe38f,#37b6ff);box-shadow:0 8px 30px -8px rgba(47,227,143,.7);'
               :'color:#fff;background:linear-gradient(90deg,#ff5d73,#ff9a5d);box-shadow:0 8px 30px -8px rgba(255,93,115,.7);');
      document.body.appendChild(t);
      requestAnimationFrame(()=>{t.style.opacity='1';t.style.transform='translate(-50%,0)';});
      setTimeout(()=>{t.style.opacity='0';t.style.transform='translate(-50%,-14px)';},2600);
      setTimeout(()=>t.remove(),3200);
    }

    onAuthStateChanged(auth,u=>{
      __mtUser=u; window.__mtSignedIn=!!u;
      if(unsub){unsub();unsub=null;}
      if(u){
        inBtn.style.display='none';chip.style.display='flex';
        document.getElementById('mnavPic').src=u.photoURL||'';
        document.getElementById('mnavNm').textContent=(u.displayName||'You').split(' ')[0];
        unsub=onSnapshot(doc(db,'users',u.uid),s=>{
          document.getElementById('mnavPts').textContent=((s.exists()&&s.data().points)||0)+' PTS';
        },()=>{});
      }else{
        inBtn.style.display='inline-block';chip.style.display='none';
      }
    });
    document.getElementById('mnavOut').onclick=()=>{menu.classList.remove('open');signOut(auth);};
  }catch(e){console.warn('nav auth',e);}
})();
</script>
