name: Build iOS

# Runs on a GitHub macOS machine, so no Mac is needed. Always produces an UNSIGNED
# .ipa (install it from Windows with Sideloadly, see README). If the five signing
# secrets below exist it also produces a development-signed .ipa.
on:
  push:
    branches: [main, ios-support]
    paths: ['ios/**', 'www/**', 'capacitor.config.json', 'package.json', '.github/workflows/ios.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install and sync (also runs pod install)
        run: |
          npm install --no-audit --no-fund
          npx cap sync ios

      - name: Build unsigned .ipa
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr Maatram-unsigned.ipa Payload
          shasum -a 256 Maatram-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: maatram-ios-unsigned
          path: Maatram-unsigned.ipa

      # ── Optional: development-signed build. Needs a paid Apple Developer account. ──
      # Secrets: IOS_CERT_P12_BASE64 (Apple Development cert + key), IOS_CERT_PASSWORD,
      # IOS_PROFILE_BASE64 (iOS App Development profile for com.maatram.app that lists
      # your iPhone's UDID), APPLE_TEAM_ID, KEYCHAIN_PASSWORD (any random string).
      - name: Are signing secrets set?
        id: sign
        env:
          P12: ${{ secrets.IOS_CERT_P12_BASE64 }}
        run: '[ -n "$P12" ] && echo "on=true" >> "$GITHUB_OUTPUT" || echo "No signing secrets: skipping the signed build."'

      - name: Build signed development .ipa
        if: steps.sign.outputs.on == 'true'
        env:
          P12: ${{ secrets.IOS_CERT_P12_BASE64 }}
          P12_PASS: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KC_PASS: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/ci.keychain-db"
          echo "$P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          echo "$PROFILE" | base64 -d > "$RUNNER_TEMP/app.mobileprovision"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASS" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KC"
          security list-keychains -d user -s "$KC" login.keychain
          security cms -D -i "$RUNNER_TEMP/app.mobileprovision" > "$RUNNER_TEMP/p.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/p.plist")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/p.plist")
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$RUNNER_TEMP/app.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          cat > "$RUNNER_TEMP/export.plist" <<PL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>development</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>com.maatram.app</key><string>$NAME</string></dict>
          </dict></plist>
          PL
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_IDENTITY="Apple Development" \
            PROVISIONING_PROFILE_SPECIFIER="$NAME"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/out"
          cp "$RUNNER_TEMP/out/App.ipa" Maatram-signed.ipa

      - uses: actions/upload-artifact@v4
        if: hashFiles('Maatram-signed.ipa') != ''
        with:
          name: maatram-ios-signed
          path: Maatram-signed.ipa
