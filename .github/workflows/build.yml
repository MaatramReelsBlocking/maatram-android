name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      # Capacitor's Android library lives in node_modules; sync copies www/ and the config into the app.
      - name: Install and sync
        run: |
          npm install --no-audit --no-fund
          npx cap sync android

      # Same key every build so updates install over the old app. Set the repo secrets
      # KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD once.
      - name: Load signing key
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/maatram.jks"
            echo "MAATRAM_KEYSTORE=$RUNNER_TEMP/maatram.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No KEYSTORE_BASE64 secret: this APK is signed with a debug key and will not install over an older copy."
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: Name APK and hash it
        run: |
          VERSION=$(grep -o 'versionName "[^"]*"' android/app/build.gradle | cut -d'"' -f2)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp android/app/build/outputs/apk/release/app-release.apk maatram.apk
          cp maatram.apk "maatram-v$VERSION.apk"
          sha256sum maatram.apk > maatram.apk.sha256
          cat maatram.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: maatram-apk
          path: maatram.apk

      # Public download for maatram.co.in/download.html. Only main publishes.
      - if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Maatram ${{ env.VERSION }} (build ${{ github.run_number }})
          body_path: maatram.apk.sha256
          make_latest: true
          files: |
            maatram.apk
            maatram-v${{ env.VERSION }}.apk
            maatram.apk.sha256
